[build]
target-dir = "target"
incremental = true
rustflags = ["-Z", "emit-stack-sizes"]

[alias]
xtask = "run --package xtask --release --"
xtest = "xtask test"

qemu-tdx = "xtask --target-arch tdx qemu --config-path .config/qemu.tdx.config.toml"
qemu-snp = "xtask --target-arch snp qemu --config-path .config/qemu.snp.toml"
qemu-snp-template = "xtask --target-arch snp qemu --config-path .config/qemu.snp.template.toml"

create-bootable-tdx = "xtask  --target-arch tdx create-bootable --release --stage2-path target/x86_64-tdx-deko/release/deko-monitor"
create-bootable-snp = "xtask  --target-arch snp create-bootable --release --stage2-path target/x86_64-snp-deko/release/deko-stage2.bin"
create-bootable-snp-debug = "xtask  --target-arch snp create-bootable --stage2-path target/x86_64-snp-deko/debug/deko-stage2.bin"

build-deko-tdx-release = "xtask --target-arch tdx build --target deko --release"
build-deko-snp-release = "xtask --target-arch snp build --target deko --release"
build-deko-tdx-debug = "xtask --target-arch tdx build --target deko"
build-deko-snp-debug = "xtask --target-arch snp build --target deko"
build-agent-debug = "xtask build-agent"
build-agent-release = "xtask build-agent --release"

build-init = "xtask build --target init"
build-init-release = "xtask build --target init --release"

stats = "xtask line-count"

pretty = "xtask pretty"

test-buddy = "xtest buddy"
test-collections = "xtest collections"

# TODO: Fork another version. This will download unnecessary git submodules recursively.
# Latest version of igvmbuilder is incompatible with our codebase, so we need to use a specific commit. We should consider forking and maintaining our own version of igvmbuilder in the future.
install-igvmbuilder = "install --git https://github.com/coconut-svsm/svsm.git igvmbuilder --rev da737d"

# For some reason the latest version does not work well on our end.
bootstrap-verus = "xtask bootstrap-verus"
bootstrap-qemu = "xtask bootstrap-qemu"
bootstrap-ovmf = "xtask bootstrap-ovmf"

[target.x86_64-snp-deko]
rustflags = [
	"-Z",
	"unstable-options",
	"-C",
	"force-frame-pointers",
	"-C",
	"linker-flavor=ld",     # using rust-lld causes some problems with relocation and gcc linker script.
	"--cfg",
	"aes_force_soft",
	"--cfg",
	"polyval_force_soft",
]

[target.x86_64-tdx-deko]
rustflags = [
	"-Z",
	"unstable-options",
]

[target.x86_64-init-deko]
rustflags = [
	"-Z",
	"unstable-options",
]

[profile.dev]
opt-level = 1
