[build]
target-dir = "target"
incremental = true

[alias]
xtask = "run --package xtask --"

qemu-sev = "xtask --target-arch sev qemu --config-path .config/qemu.sev.config.toml"
qemu-tdx = "xtask --target-arch tdx qemu --config-path .config/qemu.tdx.config.toml"

create-bootable-tdx = "xtask  --target-arch tdx create-bootable --deko-monitor-path target/x86_64-tdx-deko/release/deko-monitor"
create-bootable-sev = "xtask  --target-arch sev create-bootable --deko-monitor-path target/x86_64-sev-deko/release/deko-monitor.bin"

build-deko-tdx-release = "xtask --target-arch tdx build --target deko --release"
build-deko-sev-release = "xtask --target-arch sev build --target deko --release"
build-deko-tdx-debug = "xtask --target-arch tdx build --target deko"
build-deko-sev-debug = "xtask --target-arch sev build --target deko"
