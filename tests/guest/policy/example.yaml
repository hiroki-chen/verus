# Define your own lattice rules.
#
# You must define a partial-ordered lattice with tops and bottoms.
lattice:
  levels: [PUBLIC, APP_INTERNAL, SECRET_STORE]
  relations:
    - PUBLIC < APP_INTERNAL
    - APP_INTERNAL < SECRET_STORE
  bot: "PUBLIC"
  top: "SECRET_STORE"

# Define all the resources in the application.
resources:
  - type: "network"
    name: "SECRET_STORE_ENDPOINT"
    endpoint: "10.0.0.1:5432"
    label: "APP_INTERNAL"

  - type: "function"
    name: "foo"
    measurement: "sha256:0xdeadbeefbeefdeadcoffee"
    label: "APP_INTERNAL"

  - type: "function"
    name: "bar"
    measurement: "sha256:0xdeadbeefbeefdeadcoffee"
    label: "APP_INTERNAL"

interactions:
  - subject: "foo"
    action: "network:recv"
    source: "SECRET_STORE_ENDPOINT"
    label_transition:
      type: "UPGRADE"
      target: "subject"
      to: "SECRET_STORE"
  - subject: "foo"
    action: "network:send"
    label_transition:
      type: "DOWNGRADE"
      target: "PUBLIC"
