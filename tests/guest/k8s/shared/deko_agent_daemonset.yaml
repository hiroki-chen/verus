apiVersion: v1
kind: Namespace
metadata:
  name: deko-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deko-agent
  namespace: deko-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deko-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deko-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deko-agent
subjects:
  - kind: ServiceAccount
    name: deko-agent
    namespace: deko-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: deko-agent
  namespace: deko-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: deko-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deko-agent
    spec:
      serviceAccountName: deko-agent
      hostPID: true
      containers:
        - name: deko-agent
          image: deko-agent:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          args:
            - --interval-sec
            - "1"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DEKO_AUTO_LOAD_POLICY
              value: "1"
            - name: DEKO_POLICY_CONFIGMAP_PREFIX
              value: deko-policy-
            - name: DEKO_POLICY_CONFIGMAP_KEY
              value: policy.toml
            - name: DEKO_BINDINGS_FILE
              value: /host/tmp/deko-domain-bindings.jsonl
            - name: DEKO_HOST_PROC
              value: /host/proc
            - name: DEKO_DEVICE_PATH
              value: /host/dev/deko
            - name: DEKO_READY_DIR
              value: /host/tmp/deko-ready
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-tmp
              mountPath: /host/tmp
            - name: host-deko-device
              mountPath: /host/dev/deko
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-tmp
          hostPath:
            path: /tmp
            type: Directory
        - name: host-deko-device
          hostPath:
            path: /dev/deko
            type: CharDevice
