apiVersion: v1
kind: Namespace
metadata:
  name: faas-syscalls
  labels:
    app.kubernetes.io/part-of: syscalls-probe
    deko.project/name: syscalls
    data-storage: syscalls
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: syscalls-config
  namespace: faas-syscalls
data:
  PROBE_URL: http://syscalls-probe:8080/probe
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deko-policy-syscalls
  namespace: faas-syscalls
  labels:
    deko.project/name: syscalls
    data-storage: syscalls
data:
  policy.toml: |
    [meta]
    name = "syscalls_domain_policy"
    package = "syscalls_domain_policy"
    version = "0.1.0"

    [domain]
    selector_label = "data-storage"
    selector_value = "syscalls"

    [lattice]
    levels = ["public", "syscall_internal"]
    relations = [["public", "syscall_internal"]]
    bot = "public"
    top = "syscall_internal"

    [[resources]]
    type = "network"
    name = "SYSCALLS_HTTP"
    endpoint = "0.0.0.0:8080"
    label = "public"

    [[resources]]
    type = "function"
    name = "syscalls-probe"
    measurement = "sha256:0x44444444444444444444444444444444"
    initial_label = "syscall_internal"

    [[interactions]]
    subject = "syscalls-probe"
    action = "recv"
    source = "SYSCALLS_HTTP"
    from = "public"
    to = "syscall_internal"

    [defaults]
    unmatched_action = "deny"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syscalls-probe
  namespace: faas-syscalls
  labels:
    app.kubernetes.io/name: syscalls-probe
    app.kubernetes.io/part-of: syscalls-probe
    deko.project/name: syscalls
    data-storage: syscalls
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: syscalls-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syscalls-probe
        app.kubernetes.io/part-of: syscalls-probe
        deko.project/name: syscalls
        data-storage: syscalls
    spec:
      volumes:
        - name: deko-ready
          hostPath:
            path: /tmp/deko-ready
            type: DirectoryOrCreate
      containers:
        - name: handler
          image: syscalls-probe:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /app/scripts/wait_for_deko_bind.sh
            - python3
            - /app/scripts/syscalls_probe.py
          envFrom:
            - configMapRef:
                name: syscalls-config
          volumeMounts:
            - name: deko-ready
              mountPath: /deko-ready
              readOnly: true
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: syscalls-probe
  namespace: faas-syscalls
  labels:
    app.kubernetes.io/name: syscalls-probe
    app.kubernetes.io/part-of: syscalls-probe
    deko.project/name: syscalls
    data-storage: syscalls
spec:
  selector:
    app.kubernetes.io/name: syscalls-probe
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: syscalls-smoke
  namespace: faas-syscalls
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syscalls-smoke
        app.kubernetes.io/part-of: syscalls-probe
        deko.project/name: syscalls
        data-storage: syscalls
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: curlimages/curl:8.8.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: syscalls-config
          command:
            - sh
            - -lc
            - |
              set -eu
              response=$(curl -fsS -X POST "$PROBE_URL" -H 'Content-Type: application/json' -d '{}')
              echo "probe: $response"
