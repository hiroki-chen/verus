# Example K8s/FaaS function group for a single Deko policy domain.
#
# Domain model:
# - A domain is a set of function instances serving one business logic boundary.
# - Here the boundary is selected by the shared label:
#     data-storage: orders
# - All three functions below should be resolved into the same monitor domain.
#
# This example intentionally does not require modifying Docker/K8s startup flow.
# The guest-side resolver can infer the domain from the shared K8s labels /
# namespace metadata it can observe indirectly.
---
apiVersion: v1
kind: Namespace
metadata:
  name: faas-orders
  labels:
    app.kubernetes.io/part-of: orders-pipeline
    data-storage: orders
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-domain-config
  namespace: faas-orders
data:
  DATA_STORAGE: orders
  INGEST_URL: http://orders-ingest:8080/orders
  TRANSFORM_URL: http://orders-transform:8080/transform
  WRITER_URL: http://orders-writer:8080/write
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-ingest
  namespace: faas-orders
  labels:
    app.kubernetes.io/name: orders-ingest
    app.kubernetes.io/part-of: orders-pipeline
    deko.domain/group: orders-pipeline
    data-storage: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-ingest
        app.kubernetes.io/part-of: orders-pipeline
        deko.domain/group: orders-pipeline
        data-storage: orders
    spec:
      containers:
        - name: handler
          image: orders-ingest:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/scripts/orders_ingest.py"]
          envFrom:
            - configMapRef:
                name: orders-domain-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: orders-ingest
  namespace: faas-orders
  labels:
    app.kubernetes.io/name: orders-ingest
    app.kubernetes.io/part-of: orders-pipeline
    data-storage: orders
spec:
  selector:
    app.kubernetes.io/name: orders-ingest
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-transform
  namespace: faas-orders
  labels:
    app.kubernetes.io/name: orders-transform
    app.kubernetes.io/part-of: orders-pipeline
    deko.domain/group: orders-pipeline
    data-storage: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-transform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-transform
        app.kubernetes.io/part-of: orders-pipeline
        deko.domain/group: orders-pipeline
        data-storage: orders
    spec:
      containers:
        - name: handler
          image: orders-transform:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/scripts/orders_transform.py"]
          envFrom:
            - configMapRef:
                name: orders-domain-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: orders-transform
  namespace: faas-orders
  labels:
    app.kubernetes.io/name: orders-transform
    app.kubernetes.io/part-of: orders-pipeline
    data-storage: orders
spec:
  selector:
    app.kubernetes.io/name: orders-transform
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-writer
  namespace: faas-orders
  labels:
    app.kubernetes.io/name: orders-writer
    app.kubernetes.io/part-of: orders-pipeline
    deko.domain/group: orders-pipeline
    data-storage: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-writer
        app.kubernetes.io/part-of: orders-pipeline
        deko.domain/group: orders-pipeline
        data-storage: orders
    spec:
      containers:
        - name: handler
          image: orders-writer:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/scripts/orders_writer.py"]
          envFrom:
            - configMapRef:
                name: orders-domain-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: orders-writer
  namespace: faas-orders
  labels:
    app.kubernetes.io/name: orders-writer
    app.kubernetes.io/part-of: orders-pipeline
    data-storage: orders
spec:
  selector:
    app.kubernetes.io/name: orders-writer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: orders-pipeline-smoke
  namespace: faas-orders
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-pipeline-smoke
        app.kubernetes.io/part-of: orders-pipeline
        data-storage: orders
    spec:
      restartPolicy: Never
      containers:
        - name: smoke
          image: curlimages/curl:8.8.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: orders-domain-config
          command:
            - sh
            - -lc
            - |
              set -eu
              payload='{"order_id":"ord-1001","customer":"alice","amount":1250}'
              ingest_resp=$(curl -fsS -X POST "$INGEST_URL" -H 'Content-Type: application/json' -d "$payload")
              echo "ingest: $ingest_resp"
              transform_resp=$(curl -fsS -X POST "$TRANSFORM_URL" -H 'Content-Type: application/json' -d "$ingest_resp")
              echo "transform: $transform_resp"
              writer_resp=$(curl -fsS -X POST "$WRITER_URL" -H 'Content-Type: application/json' -d "$transform_resp")
              echo "writer: $writer_resp"
