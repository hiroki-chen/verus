[package]
name = "deko-policy-format"
edition = "2021"

[package.metadata.verus]
verify = true

[dependencies]
vstd = { workspace = true, features = ["allow_panic"] }
verus_builtin = { workspace = true }
verus_builtin_macros = { workspace = true }

deko-std = { workspace = true, default-features = false, features = ["alloc", "snp"] }

[features]
default = ["alloc"]
alloc = ["deko-std/alloc", "deko-std/snp"]
