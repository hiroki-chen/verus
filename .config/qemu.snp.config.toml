memory = "64G"
debug = false
extra_config = [
  "-d",
  "int,cpu_reset",
  "-D",
  "qemu.log",
  # Using this disk image for launching the Linux guest.
  "-drive",
  "file=tools/guest_image.qcow2,format=qcow2,snapshot=off,id=disk0,if=none",
  # SCSI
  "-device",
  "virtio-scsi-pci,id=scsi0,disable-legacy=on,iommu_platform=on",
  # Disk device
  "-device",
  "scsi-hd,drive=disk0,bootindex=0",
  # Network device
  # "-netdev user,id=vmnic",
  # "-device",
  # "e1000,netdev=vmnic,romfile=",
]
# For debugging please reduce cores to catch early logic bugs.
smp_cores = 2
