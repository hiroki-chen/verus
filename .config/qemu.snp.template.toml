  # Template values only. Copy this file to `.config/qemu.snp.toml`
  # and replace the placeholder paths with your local environment.
memory = "64G"
debug = false
igvm_path = "/absolute/path/to/cage-sev/target/x86_64-snp-deko/release/igvm.igvm"
extra_config = [
  "-cpu",
  "EPYC-v5",
  "-d",
  "int,cpu_reset",
  "-D",
  "qemu.log",
  "-drive",
  "file=/absolute/path/to/guest-disk.qcow2,format=qcow2,snapshot=off,id=disk0,if=none",
  "-device",
  "virtio-scsi-pci,id=scsi0,disable-legacy=on,iommu_platform=on",
  "-device",
  "scsi-hd,drive=disk0",
  "-netdev",
  "user,id=vmnic,hostfwd=tcp::11451-:22",
  "-device",
  "e1000,netdev=vmnic,romfile=",
  "-serial",
  "mon:stdio",
  "-virtfs",
  "local,path=/absolute/path/to/host-share,mount_tag=host_share,security_model=none,id=fs0",
  "-virtfs",
  "local,path=/absolute/path/to/cage-sev/tests/guest,mount_tag=guest_tests,security_model=none,id=fs1",
  "-kernel",
  "/absolute/path/to/linux/arch/x86/boot/bzImage",
  "-append",
  "root=/dev/sda1 console=ttyS0 no5lvl nopti hugepages=0 mem_encrypt=on intremap=off nox2apic"
]
# For debugging please reduce cores to catch early logic bugs.
smp_cores = 16
