[package]
name = "deko-core"
edition = "2021"

[[bin]]
path = "src/stage2.rs"
name = "stage2"

[[bin]]
path = "src/monitor.rs"
name = "deko"

[lib]
path = "src/stage2.rs"

[package.metadata.verus]
verify = true

[dependencies]
vstd = { workspace = true, features = ["allow_panic"] }
verus_builtin = { workspace = true }
verus_builtin_macros = { workspace = true }

deko-std = { workspace = true, features = ["alloc", "global_alloc"] }
deko-logging = { workspace = true, optional = true }
log = { version = "0.4.27", optional = true }
paste = "1.0.15"

[features]
default = ["snp", "logging"]
tdx = []
snp = ["deko-std/snp"]
# Enable logging?
logging = ["deko-logging", "log"]
