[package]
name = "deko-core"
edition = "2021"

[package.metadata.verus]
verify = true

[dependencies]
vstd = { workspace = true, features = ["alloc"] }
builtin = { workspace = true }
builtin_macros = { workspace = true }

deko-meta = { workspace = true }
deko-macros = { workspace = true }
deko-std = { workspace = true }
deko-logging = { workspace = true, optional = true }
log = { version = "0.4.27", optional = true }

[features]
default = ["snp", "logging"]
tdx = []
snp = []
# Enable logging?
logging = ["deko-logging", "log"]
