[workspace]
resolver = "2"
members = [
    "deko-core",
    "deko-logging",
    "deko-meta",
    "deko-macros",
    "deko-stage1",
    "deko-std",
    "xtask",
]

[workspace.dependencies]
# Verus repos
vstd = { git = "https://github.com/hiroki-chen/verus.git", default-features = false }
verus_builtin = { git = "https://github.com/hiroki-chen/verus.git" }
verus_builtin_macros = { git = "https://github.com/hiroki-chen/verus.git" }
verus_state_machines_macros = { git = "https://github.com/hiroki-chen/verus.git" }

syn_verus = { git = "https://github.com/ziqiaozhou/verus", rev = "7c4a5274a4d74522f3965eb038bb7e22fa5eebef", features = [
    "full",
    "visit-mut",
    "extra-traits",
] }
prettyplease_verus = { git = "https://github.com/ziqiaozhou/verus", rev = "7c4a5274a4d74522f3965eb038bb7e22fa5eebef" }

deko-core = { path = "deko-core", default-features = false }
deko-logging = { path = "deko-logging" }
deko-macros = { path = "deko-macros" }
deko-meta = { path = "deko-meta" }
deko-std = { path = "deko-std" }

# the profile used for `cargo build`
[profile.dev]
panic = "abort"    # disable stack unwinding on panic
incremental = true

# the profile used for `cargo build --release`
[profile.release]
panic = "abort"    # disable stack unwinding on panic
incremental = true
debug = false
