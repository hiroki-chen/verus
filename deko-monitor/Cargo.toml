[package]
name = "deko-monitor"
edition = "2021"

[package.metadata.verus]
verify = true

[dependencies]
deko-core = { workspace = true, default-features = false }
deko-meta = { workspace = true }

[build-dependencies]
cc = "1.0"

[features]
default = ["snp"]
snp = ["deko-core/snp"]
tdx = ["deko-core/tdx"]
logging = ["deko-core/logging"]
