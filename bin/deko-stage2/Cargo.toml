[package]
name = "stage2"
version = "0.1.0"
edition = "2021"

[dependencies]
vstd = { workspace = true, features = ["allow_panic"] }
verus_builtin = { workspace = true }
verus_builtin_macros = { workspace = true }

deko-core = { workspace = true }
deko-std = { workspace = true, features = ["alloc", "global_alloc"] }

[package.metadata.verus]
verify = true

[features]
default = ["logging"]
logging = ["deko-core/logging"]
snp = ["deko-core/snp"]
