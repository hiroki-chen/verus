[package]
name = "deko-std"
version = "0.1.0"
edition = "2021"

[dependencies]
vstd = { workspace = true }
verus_builtin = { workspace = true }
verus_builtin_macros = { workspace = true }
verus_state_machines_macros = { workspace = true }

cfg-if = { version = "1.0.4", default-features = false }
itoa = { version = "1.0.15", features = ["no-panic"] }
lexical-core = { version = "1.0.6", default-features = false, features = [
  "write-integers",
  "write-floats",
  "power-of-two",
] }
paste = "1.0.15"
ryu = { version = "1.0.20", features = ["no-panic"] }
hashbrown = { version = "0.16.1", optional = true, default-features = false, features = [
  "default-hasher",
  "inline-more",
  "allocator-api2",
] }

deko-macros = { workspace = true }
allocator-api2 = { version = "=0.2.9", default-features = false, features = ["alloc"] }

[package.metadata.verus]
verify = true

[features]
default = []
alloc = ["vstd/alloc", "hashbrown"]
logging = []
snp = []
tdx = []
